name: Publish JSR
on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Checkout spry repo
        uses: actions/checkout@v5
        with:
          repository: sijucj/spry_private
          token: ${{ secrets.GH_PAT }}
          path: spry

      - name: Copy source files from spry repo
        run: |
          # Exclude list: README.md, mod.ts, jsr.json, LICENSE (keep our local versions)
          EXCLUDE="--exclude=README.md --exclude=mod.ts --exclude=jsr.json --exclude=LICENSE"
          EXCLUDE2="--exclude=README.md --exclude=jsr.json --exclude=LICENSE"

          # Copy to jsr_package/universal (both as subfolders to preserve import paths)
          rsync -a $EXCLUDE spry/lib/universal/ jsr_package/universal/

          # Copy to jsr_package/extend (from lib/extend)
          rsync -a $EXCLUDE spry/lib/extend/ jsr_package/extend/

          # Copy to jsr_package/reflect (from lib/reflect)
          rsync -a $EXCLUDE spry/lib/reflect/ jsr_package/reflect/

          # Copy to jsr_package/spawn (from lib/spawn, includes sql-shell subfolder, and universal as subfolder)
          rsync -a $EXCLUDE2 spry/lib/spawn/ jsr_package/spawn/

          # Copy to jsr_package/tap (from lib/tap)
          rsync -a $EXCLUDE spry/lib/tap/ jsr_package/tap/

      - name: Update jsr.json and fix imports
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          PKGS="universal extend reflect spawn tap"
          
          # 1. Create a root deno.json to define a workspace. 
          # This is critical for JSR to resolve circular dependencies between peer packages locally.
          echo "{\"workspace\": [" > deno.json
          FIRST=true
          for pkg in $PKGS; do
            if [ "$FIRST" = true ]; then FIRST=false; else echo "," >> deno.json; fi
            echo "  \"./jsr_package/$pkg\"" >> deno.json
          done
          echo "]}" >> deno.json

          for pkg in $PKGS; do
            echo "Processing $pkg..."
            cd jsr_package/$pkg
            
            # 2. Update version
            jq --arg version "$VERSION" '.version = $version' jsr.json > jsr.json.tmp && mv jsr.json.tmp jsr.json
            
            # 3. Update exports to allow deep imports (JSR forbids globs in keys, so explicit list is needed)
            # Find all .ts files, excluding tests and mod.ts
            find . -name "*.ts" -not -name "*_test.ts" -not -name "mod.ts" -printf "%P\n" | while read -r f; do
              echo "  \"./$f\": \"./$f\"," >> exports_list.tmp
            done
            if [ -f exports_list.tmp ]; then
              sed -i '$ s/,$//' exports_list.tmp
              echo "{" > exports.json
              cat exports_list.tmp >> exports.json
              echo "}" >> exports.json
              jq --argjson list "$(cat exports.json)" '.exports = ({"." : "./mod.ts"} + $list)' jsr.json > jsr.json.tmp && mv jsr.json.tmp jsr.json
              rm exports_list.tmp exports.json
            else
              jq '.exports = {"." : "./mod.ts"}' jsr.json > jsr.json.tmp && mv jsr.json.tmp jsr.json
            fi
            
            # 4. Add peer packages to imports map
            for other in $PKGS; do
              if [ "$other" != "$pkg" ]; then
                # Map to JSR dependency (workspace will resolve this locally during publish)
                BASE_VERSION=$(echo $VERSION | cut -d. -f1,2)
                jq --arg name "@sijucj/$other" --arg target "jsr:@sijucj/$other@^$BASE_VERSION" '.imports[$name] = $target' jsr.json > jsr.json.tmp && mv jsr.json.tmp jsr.json
              fi
            done
            
            # 5. Fix code imports:
            # Replace relative paths with package paths
            for other in $PKGS; do
              if [ "$other" == "$pkg" ]; then
                REPLACEMENT="./"
              else
                REPLACEMENT="@sijucj/$other/"
              fi
              find . -name "*.ts" -type f -exec sed -i "s|\"\.\./$other/|\"$REPLACEMENT|g" {} +
              find . -name "*.ts" -type f -exec sed -i "s|'\.\./$other/|'$REPLACEMENT|g" {} +
            done
            
            cd ../..
          done

      - name: Publish JSR packages
        run: |
          # Publish from the workspace root to handle circular dependencies correctly
          npx jsr publish --allow-dirty --allow-slow-types
